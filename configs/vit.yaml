save_path: results/vit/
model:
    name: "vit"
    init:
        type: 'torch.nn.init.kaiming_normal_'
        conf: {'conv': {'mode': 'fan_out'}, 'linear': {'mode': 'fan_in'}}


training:
    B: 32
    log_interval: 20
    patience: 15
    optim: 'torch.optim.AdamW'
    opt: {}
    lr: 25e-4 
    decay_lr: 0.1



data:
    transformations:
        test:
            -   types:  torchvision.transforms.Resize
                params: {'size': [64, 64]}
        train:
            -   types:  torchvision.transforms.Resize
                params: {'size': [75, 75]}
            -   types:  torchvision.transforms.RandomHorizontalFlip
                params: {p: 0.5}
            -   types:  torchvision.transforms.RandomRotation
                params: {degrees: [-11, 11],
                         interpolation: torchvision.transforms.functional.InterpolationMode.BILINEAR}
            -   types:  torchvision.transforms.RandomCrop
                params: {'size': [64, 64]}
        normalization:
            -   types:  dataset.transformations.ChannelMean
                params: {}