save_path: results/point5/
model:
    name: "CNN_5b"
    nn_config: |
        conv2d      channels: ->8   kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 8
        relu
        conv2d      channels: ->8   kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 8
 
        maxpool2d                   kernel_size: (2, 2)  stride: (2, 2)
        dropout     p: 0.5

        conv2d      channels: ->16  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 16
        relu
        conv2d      channels: ->16  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 16 
        
        maxpool2d                   kernel_size: (2, 2)  stride: (2, 2)
        dropout     p: 0.5

        conv2d      channels: ->32  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 32
        relu
        conv2d      channels: ->32  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 32
        
        maxpool2d                   kernel_size: (2, 2)  stride: (2, 2)
        dropout     p: 0.5

        conv2d      channels: ->64  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 64
        relu
        conv2d      channels: ->64  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 64
        
        maxpool2d                   kernel_size: (2, 2)  stride: (2, 2)
        dropout     p: 0.5


        conv2d      channels: ->96  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 96
        relu
        conv2d      channels: ->96  kernel_size: (3, 3)  stride: (1, 1)  padding: (1, 1)
        batchnorm2d num_features: 96
        
        maxpool2d                   kernel_size: (2, 2)  stride: (2, 2)
        dropout     p: 0.2
        
        flatten
        linear    dims:         ->15
    init:
        type: 'torch.nn.init.kaiming_normal_'
        conf: {'conv': {'mode': 'fan_out'}, 'linear': {'mode': 'fan_in'}}


training:
    B: 32
    log_interval: 20
    patience: 20
    optim: 'torch.optim.AdamW'
    opt: {}
    lr: 70e-4 
    decay_lr: 0.1


data:
    transformations:
        test:
            -   types:  torchvision.transforms.Resize
                params: {'size': [64, 64]}
        train:
            -   types:  torchvision.transforms.Resize
                params: {'size': [75, 75]}
            -   types:  torchvision.transforms.RandomHorizontalFlip
                params: {p: 0.5}
            -   types:  torchvision.transforms.RandomRotation
                params: {degrees: [-11, 11],
                         interpolation: torchvision.transforms.functional.InterpolationMode.BILINEAR}
            -   types:  torchvision.transforms.RandomCrop
                params: {'size': [64, 64]}
        normalization:
            -   types:  dataset.transformations.ChannelMean
                params: {}